---
- name: Install Starr Apps docker compose app
  ansible.builtin.include_role:
    name: docker-compose-app
  vars:
    docker_app_name: "{{ app_name }}"
    docker_app_display_name: "{{ display_name }}"
    docker_app_description: "{{ description }}"
    docker_app_compose_template: >-
      {{ playbook_dir }}/roles/starr-apps/templates/docker-compose.yml.j2
    docker_app_settings_directories:
      - "{{ docker_settings_directory }}/prowlarr"
      - "{{ docker_settings_directory }}/sonarr"
      - "{{ docker_settings_directory }}/radarr"
      - "{{ docker_settings_directory }}/bazarr"
      - "{{ docker_settings_directory }}/recyclarr"
