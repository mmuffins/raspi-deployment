---
#https://github.com/geerlingguy/ansible-role-docker_arm

- name: Install dependencies
  ansible.builtin.apt:
    state: present
    name:
      - apt-transport-https
      - ca-certificates
      - python3-debian
      - software-properties-common

- name: Check python3-debian availability
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable | default('/usr/bin/python3') }}"
      - -c
      - import debian
  changed_when: false
  failed_when: false
  check_mode: false
  register: docker_python3_debian

- name: Add docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/raspbian/
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/raspbian/gpg
    state: present
  when: not ansible_check_mode or docker_python3_debian.rc == 0
  register: docker_apt_repository

- name: Check if Docker is already present
  ansible.builtin.command: which docker
  failed_when: false
  changed_when: false
  check_mode: false
  register: docker_command_result

- name: Reboot
  ansible.builtin.reboot:
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  when: docker_command_result.rc == 1

- name: Download docker install convenience script
  ansible.builtin.get_url:
    url: https://get.docker.com/
    dest: /tmp/get-docker.sh
    mode: "0775"
  when: docker_command_result.rc == 1

- name: Install docker
  ansible.builtin.command: /tmp/get-docker.sh
  environment:
    CHANNEL: stable
  when: docker_command_result.rc == 1
  failed_when: diff_cmd.rc != 0 or diff_cmd.rc != 100
  ignore_errors: true # After trying for days I couldn't get this to run. It installs fine but always throws errors

- name: Reboot
  ansible.builtin.reboot:
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  when: docker_command_result.rc == 1

- name: Install Docker Compose plugin
  ansible.builtin.apt:
    state: present
    name: docker-compose-plugin
    update_cache: "{{ docker_apt_repository.changed | default(false) }}"

- name: Ensure docker users are added to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  with_items: "{{ docker_user_name }}"

- name: Enable Docker IPv6
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0600"
    content: |
      {
        "ipv6": true,
        "fixed-cidr-v6": "2001:db8:1::/64"
      }
  notify: restart docker

- name: Enable docker service autostart
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
