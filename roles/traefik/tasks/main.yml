---
- name: Install Traefik docker compose app
  ansible.builtin.include_role:
    name: docker-compose-app
  vars:
    docker_app_name: "{{ app_name }}"
    docker_app_display_name: "{{ display_name }}"
    docker_app_description: "{{ description }}"
    docker_app_compose_template: >-
      {{ playbook_dir }}/roles/traefik/templates/docker-compose.yml.j2

- name: Create traefik config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ docker_settings_directory }}/{{ app_name }}/traefik.yml"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ file_mask }}"

- name: Create traefik dynamic conf
  ansible.builtin.template:
    src: dynamic_conf.yml.j2
    dest: "{{ docker_settings_directory }}/{{ app_name }}/dynamic_conf.yml"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ file_mask }}"
