---
- name: Gather docker user facts before Prometheus setup
  ansible.builtin.include_role:
    name: docker-compose-app
    tasks_from: facts.yml

- name: Create Prometheus settings folder
  ansible.builtin.file:
    state: directory
    path: "{{ docker_settings_directory }}/{{ app_name }}"
    owner: "{{ docker_puid }}"
    group: "{{ docker_pgid }}"
    mode: "{{ folder_mask }}"

- name: Create config subfolder
  ansible.builtin.file:
    state: directory
    path: "{{ docker_settings_directory }}/{{ app_name }}/config"
    owner: "{{ docker_puid }}"
    group: "{{ docker_pgid }}"
    mode: "{{ folder_mask }}"

- name: Install Prometheus docker compose app
  ansible.builtin.include_role:
    name: docker-compose-app
    tasks_from: deploy.yml
  vars:
    docker_app_name: "{{ app_name }}"
    docker_app_display_name: "{{ display_name }}"
    docker_app_description: "{{ description }}"
    docker_app_compose_template: >-
      {{ playbook_dir }}/roles/prometheus/templates/docker-compose.yml.j2
