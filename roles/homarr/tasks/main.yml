---
- ansible.builtin.import_tasks: facts.yml

- name: Validate Homarr encryption key
  ansible.builtin.assert:
    that:
      - homarr_secret_encryption_key is defined
      - homarr_secret_encryption_key is string
      - homarr_secret_encryption_key is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      homarr_secret_encryption_key must be a unique 64-character hexadecimal
      value. Generate one with `openssl rand -hex 32` and store it securely in
      the inventory.
  no_log: true

- name: Create docker compose app folder
  ansible.builtin.file:
    state: directory
    path: "{{ docker_compose_app_directory }}/{{ app_name }}"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ folder_mask }}"

- name: Set docker compose app name
  ansible.builtin.lineinfile:
    dest: "{{ docker_compose_app_directory }}/{{ app_name }}/name"
    create: true
    state: present
    regexp: ".*"
    line: "{{ display_name }}"

- name: Set docker compose app description
  ansible.builtin.lineinfile:
    dest: "{{ docker_compose_app_directory }}/{{ app_name }}/description"
    create: true
    state: present
    regexp: ".*"
    line: "{{ description }}"

- name: Set docker compose app redirection
  ansible.builtin.copy:
    content: "{{ docker_compose_directory }}/{{ app_name }}"
    dest: "{{ docker_compose_app_directory }}/{{ app_name }}/indirect"

- name: Create docker compose folder
  ansible.builtin.file:
    state: directory
    path: "{{ docker_compose_directory }}/{{ app_name }}"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ folder_mask }}"

- name: Create settings folder
  ansible.builtin.file:
    state: directory
    path: "{{ docker_settings_directory }}/{{ app_name }}"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ folder_mask }}"

- name: Create secrets folder
  ansible.builtin.file:
    state: directory
    path: "{{ docker_settings_directory }}/{{ app_name }}/secrets"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ folder_mask }}"

- name: Create Homarr encryption key file
  ansible.builtin.copy:
    content: "{{ homarr_secret_encryption_key }}"
    dest: "{{ docker_settings_directory }}/{{ app_name }}/secrets/encryption_key"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "0600"
  no_log: true

- name: Create docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_directory }}/{{ app_name }}/docker-compose.yml"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ file_mask }}"
  register: created_docker_compose
