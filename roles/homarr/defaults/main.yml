---
homarr_description: "A customizable dashboard for managing self-hosted services."
homarr_display_name: "Homarr"
homarr_app_name: homarr
homarr_image: ghcr.io/homarr-labs/homarr:latest
homarr_container_port: 7575
homarr_docker_socket_enabled: true
homarr_traefik_endpoint: "{{ traefik_endpoint | default('http') }}"
homarr_network_name: "{{ network_name | default('reverse-proxy') }}"
homarr_settings_directory: "{{ docker_settings_directory | default('/mnt/user/appdata') }}"
homarr_compose_directory: "{{ docker_compose_directory | default('/mnt/user/appdata/docker-compose') }}"
homarr_compose_app_directory: "{{ docker_compose_app_directory | default('/boot/config/plugins/compose.manager/projects') }}"
homarr_timezone: "{{ docker_timezone | default('Europe/Vienna') }}"
homarr_file_mask: "0644"
homarr_folder_mask: "0777"
homarr_icon_url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homarr.png"
