---
- name: Gather docker user facts before Seanime setup
  ansible.builtin.include_role:
    name: docker-compose-app
    tasks_from: facts.yml

- name: Create mover settings folder
  ansible.builtin.file:
    state: directory
    path: "{{ docker_settings_directory }}/seanime-mover"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ folder_mask }}"

- name: Install Seanime docker compose app
  ansible.builtin.include_role:
    name: docker-compose-app
    tasks_from: deploy.yml
  vars:
    docker_app_name: "{{ app_name }}"
    docker_app_display_name: "{{ display_name }}"
    docker_app_description: "{{ description }}"
    docker_app_compose_template: >-
      {{ playbook_dir }}/roles/seanime/templates/docker-compose.yml.j2
