---
- name: Gather docker user facts before Syncthing setup
  ansible.builtin.include_role:
    name: docker-compose-app
    tasks_from: facts.yml

- name: Create Syncthing data directories
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    owner: "{{ docker_puid }}"
    group: "{{ docker_pgid }}"
    mode: "{{ folder_mask }}"
  loop:
    - "{{ docker_settings_directory }}/{{ app_name }}"
    - "{{ docker_settings_directory }}/{{ app_name }}/config"
    - "{{ docker_settings_directory }}/{{ app_name }}/data"

- name: Install Syncthing docker compose app
  ansible.builtin.include_role:
    name: docker-compose-app
    tasks_from: deploy.yml
  vars:
    docker_app_name: "{{ app_name }}"
    docker_app_display_name: "{{ display_name }}"
    docker_app_description: "{{ description }}"
    docker_app_compose_template: >-
      {{ playbook_dir }}/roles/syncthing/templates/docker-compose.yml.j2
