---
- name: Validate Checkmk configuration
  ansible.builtin.assert:
    that:
      - checkmk_password is defined
      - checkmk_password is string
      - checkmk_password | length > 0
      - checkmk_site_id is match('^[a-z][a-z0-9_]{0,15}$')
    fail_msg: >-
      checkmk_password must be a non-empty inventory secret and checkmk_site_id
      must start with a lowercase letter and contain at most 16 lowercase
      letters, digits, or underscores.
  no_log: true

- name: Install Checkmk docker compose app
  ansible.builtin.include_role:
    name: docker-compose-app
  vars:
    docker_app_name: "{{ app_name }}"
    docker_app_display_name: "{{ display_name }}"
    docker_app_description: "{{ description }}"
    docker_app_compose_template: >-
      {{ playbook_dir }}/roles/checkmk/templates/docker-compose.yml.j2

- name: Create docker-compose .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ docker_compose_directory }}/{{ app_name }}/.env"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "0600"
  register: created_docker_compose_env
  no_log: true
