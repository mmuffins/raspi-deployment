---
- name: Get Docker user ID
  ansible.builtin.command: "id -u {{ docker_user_name }}"
  register: checkmk_docker_user_id_result
  changed_when: false
  check_mode: false

- name: Get Docker user group ID
  ansible.builtin.command: "id -g {{ docker_user_name }}"
  register: checkmk_docker_group_id_result
  changed_when: false
  check_mode: false

- name: Set Checkmk Docker ownership facts
  ansible.builtin.set_fact:
    checkmk_docker_user_id: "{{ checkmk_docker_user_id_result.stdout }}"
    checkmk_docker_group_id: "{{ checkmk_docker_group_id_result.stdout }}"
  check_mode: false
