---
- name: Get docker user id
  ansible.builtin.command: "id -u {{ docker_user_name }}"
  register: docker_app_user_id_result
  changed_when: false
  check_mode: false

- name: Get docker user group id
  ansible.builtin.command: "id -g {{ docker_user_name }}"
  register: docker_app_group_id_result
  changed_when: false
  check_mode: false

- name: Get docker user group name
  ansible.builtin.command:
    argv:
      - getent
      - group
      - "{{ docker_app_group_id_result.stdout }}"
  register: docker_app_group_result
  changed_when: false
  check_mode: false

- name: Set docker facts
  ansible.builtin.set_fact:
    docker_user_id: "{{ docker_app_user_id_result.stdout }}"
    docker_group_id: "{{ docker_app_group_id_result.stdout }}"
    docker_group_name: "{{ docker_app_group_result.stdout.split(':')[0] }}"
  check_mode: false
