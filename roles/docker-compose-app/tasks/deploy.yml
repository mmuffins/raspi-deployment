---
- name: Create docker compose app folder
  ansible.builtin.file:
    state: directory
    path: "{{ docker_compose_app_directory }}/{{ docker_app_name }}"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ folder_mask }}"

- name: Set docker compose app name
  ansible.builtin.lineinfile:
    dest: "{{ docker_compose_app_directory }}/{{ docker_app_name }}/name"
    create: true
    state: present
    regexp: ".*"
    line: "{{ docker_app_display_name }}"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ file_mask }}"

- name: Set docker compose app description
  ansible.builtin.lineinfile:
    dest: "{{ docker_compose_app_directory }}/{{ docker_app_name }}/description"
    create: true
    state: present
    regexp: ".*"
    line: "{{ docker_app_description }}"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ file_mask }}"

- name: Set docker compose app redirection
  ansible.builtin.copy:
    content: "{{ docker_compose_directory }}/{{ docker_app_name }}"
    dest: "{{ docker_compose_app_directory }}/{{ docker_app_name }}/indirect"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ file_mask }}"

- name: Create docker compose folder
  ansible.builtin.file:
    state: directory
    path: "{{ docker_compose_directory }}/{{ docker_app_name }}"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ folder_mask }}"

- name: Create settings folder
  ansible.builtin.file:
    state: directory
    path: "{{ docker_settings_directory }}/{{ docker_app_name }}"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ folder_mask }}"

- name: Create docker-compose file
  ansible.builtin.template:
    src: "{{ docker_app_compose_template }}"
    dest: "{{ docker_compose_directory }}/{{ docker_app_name }}/docker-compose.yml"
    owner: "{{ docker_user_id }}"
    group: "{{ docker_group_id }}"
    mode: "{{ file_mask }}"
  register: created_docker_compose
